name: Build and release LilyPond scores

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p $HOME/.local
          curl -L https://gitlab.com/lilypond/lilypond/-/releases/v2.24.4/downloads/lilypond-2.24.4-linux-x86_64.tar.gz -o lilypond.tar.gz
          tar -xzf lilypond.tar.gz -C $HOME/.local --strip-components=1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$HOME/.local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Compile .ly scores
        run: |
          for d in */ ; do
            if [[ "$d" != .* ]]; then
              echo "Entering folder: $d"
              cd "$d"
              for f in *.ly; do
                if [[ -f "$f" ]]; then
                  echo "Compiling $f"
                  lilypond "$f"
                fi
              done
              cd ..
            fi
          done

      - name: Package artifacts
        run: |
          zip -r mass-ave.zip **/*.pdf

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: Automated build of LilyPond scores
          draft: false
          prerelease: false

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: mass-ave.zip
          asset_name: mass-ave.zip
          asset_content_type: application/zip
